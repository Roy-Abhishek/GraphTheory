name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

# NOTE: the template's `leanprover-community/docgen-action@v1` step (API docs + GitHub Pages
# deploy) was removed: it failed every `push` run and cannot succeed in this repo.
#   - Its docs build (build_docs.sh) runs at the repo root and reads `lean-toolchain` there;
#     the package lives in lean/, and `lake_package_directory` only affects metadata parsing.
#   - GitHub Pages is not enabled, so its deploy step 404s (the original root-layout runs
#     built Mathlib docs for ~2 h and then failed there).
#   - All of its docs steps are gated on `push`, which is why pull_request runs always passed.
# To bring docs back: enable Pages (Settings > Pages > Source: GitHub Actions), restore
# `pages: write` and `id-token: write` above, and add the docgen step after lean-action once
# the docs build can be pointed at lean/.
#
# NOTE (2026-10-06): added a follow-up diagnostic step. `leanprover/lean-action@v1` fails the
# job on a real Lean/lake error but does not surface the error text itself as a check
# annotation (only "lake build failed" + the exit code) - and the raw log is only reachable
# through GitHub's signed Azure Blob Storage redirect, which needs a browser or extra access
# this environment doesn't always have. So on failure we re-run `lake build` ourselves
# (cache is warm, so this is fast), capture its output, and emit the real error lines as
# `::error::` workflow commands - those become ordinary check-run annotations, readable
# through the plain REST API with no extra access needed.
#
# NOTE (2026-10-07): switched `build` to a matrix over individual module targets (via
# lean-action's `build-args`, i.e. `lake build <target>`), so independent pieces (Lemma 1's
# three claims, for now) compile as separate parallel jobs instead of one job building
# everything serially. Each job's cache/toolchain setup is duplicated (free/unlimited on a
# public repo) in exchange for all of them finishing in roughly one job's wall-clock time,
# and the diagnostic step is per-target so a failure in one claim doesn't hide another's.

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - BootstrapPercolation.Basic
          - BootstrapPercolation.MainResult
          - BootstrapPercolation.Lemma1Triangle
          - BootstrapPercolation.Lemma1ClaimI
          - BootstrapPercolation.Lemma1ClaimII
          - BootstrapPercolation.Lemma1ClaimIII

    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ matrix.target }}
        id: lean_build
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build-args: ${{ matrix.target }}
        continue-on-error: true

      - name: Surface the real Lean/lake error as annotations
        if: steps.lean_build.outcome == 'failure'
        working-directory: lean
        run: |
          set +e
          ~/.elan/bin/lake build ${{ matrix.target }} > /tmp/build.log 2>&1
          set -e
          echo "----- last 200 lines of lake build output (${{ matrix.target }}) -----"
          tail -n 200 /tmp/build.log
          python3 - << 'PYEOF'
          import re
          with open('/tmp/build.log') as f:
              text = f.read()
          blocks = re.split(r'\n(?=\S)', text)
          err_blocks = [b.strip() for b in blocks if re.search(r'\berror:', b)]
          if not err_blocks:
              err_blocks = [text[-3000:]]
          for b in err_blocks[:8]:
              b = b[:3500]
              safe = b.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error::{safe}")
          PYEOF
          exit 1
