name: Create Release

on:
  push:
    branches:
      - 'main'
      - 'master'
    paths:
      # NOTE: lean-release-tag@v1 reads `lean-toolchain` at the repo root only and has no
      # directory option, so with the package in lean/ this job runs but creates no tags.
      - 'lean/lean-toolchain'

jobs:
  lean-release-tag:
    name: Add Lean release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: lean-release-tag action
      uses: leanprover-community/lean-release-tag@v1
      with:
        do-release: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
